<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Real Estate</title>
    <!-- استيراد خط عربي مميز من جوجل -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
        }
        .container {
            max-width: 700px;
            padding: 20px;
        }
        h1 {
            font-size: 3.5rem;
            margin-bottom: 20px;
            color: #f59e0b;
            font-weight: 700;
            letter-spacing: 1px;
        }
        p {
            font-size: 1.2rem;
            color: #94a3b8;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            background-color: #f59e0b;
            color: #0f172a;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
        }
        .btn:hover {
            background-color: #d97706;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4);
        }
        .footer {
            position: absolute;
            bottom: 20px;
            font-size: 0.9rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Royal Real Estate</h1>
        <p>مرحباً بك في منصتك العقارية المستقبلية. نحن نعمل على تجهيز واجهات وبرمجيات قوية لتجربة استثنائية.</p>
        <a href="#explore" class="btn">قريباً... ابدأ التصفح</a>
    </div>

    <div class="footer">
        &copy; 2026 Royal Real Estate. All rights reserved.
    </div>

</body>
</html>
