<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Real Estate - WhatsApp Sender</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #ffffff;
            padding: 30px;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h2 {
            color: #f59e0b;
            margin-bottom: 25px;
            text-align: center;
        }
        .upload-box {
            border: 2px dashed #475569;
            padding: 20px;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 20px;
            background: #0f172a;
        }
        input[type="file"] {
            color: #f59e0b;
            padding: 8px;
            background: #1e293b;
            border-radius: 6px;
            border: 1px solid #475569;
            cursor: pointer;
            width: 100%;
            max-width: 400px;
            margin-top: 10px;
        }
        .message-box {
            margin-bottom: 20px;
        }
        .message-box label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-weight: 600;
        }
        textarea {
            width: 100%;
            height: 100px;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            resize: none;
            font-size: 1rem;
        }
        .btn-group {
            display: flex;
            gap: 15px;
        }
        .btn {
            background-color: #f59e0b;
            color: #0f172a;
            padding: 14px 20px;
            font-size: 1.05rem;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            flex: 1;
            text-align: center;
        }
        .btn:hover {
            background-color: #d97706;
        }
        .btn-secondary {
            background-color: #334155;
            color: #fff;
        }
        .btn-secondary:hover {
            background-color: #475569;
        }
        .status-badge {
            text-align: center;
            margin: 15px 0;
            font-size: 1.1rem;
            color: #38bdf8;
            font-weight: 600;
        }
        .table-container {
            max-height: 280px;
            overflow-y: auto;
            margin-top: 20px;
            border-radius: 8px;
            border: 1px solid #334155;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px 15px;
            text-align: right;
            border-bottom: 1px solid #334155;
        }
        th {
            background-color: #0f172a;
            color: #f59e0b;
            position: sticky;
            top: 0;
        }
        .file-info {
            margin-top: 8px;
            font-size: 0.9rem;
            color: #10b981;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Royal Real Estate - نظام إرسال الواتساب المتسلسل</h2>

        <div class="upload-box">
            <label style="color: #cbd5e1; font-weight: 600;">اختر شيت الأكسيل:</label><br>
            <input type="file" id="excelFile" accept=".xlsx, .xls" onchange="handleExcel(event)">
            <div id="fileInfo" class="file-info"></div>
        </div>

        <div class="message-box">
            <label for="wamessage">اكتب رسالة الواتساب:</label>
            <textarea id="wamessage" placeholder="اكتب النص هنا..."></textarea>
        </div>

        <!-- أزرار التحكم -->
        <div class="btn-group">
            <button class="btn" onclick="startSequentialSending()">🚀 إرسال متسلسل (فتح الرقم التالي)</button>
            <button class="btn btn-secondary" onclick="resetQueue()">إعادة ضبط</button>
        </div>

        <div id="statusBadge" class="status-badge">جاهز للبدء... اختر الأرقام واضغط إرسال</div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th style="width: 50px;"><input type="checkbox" id="selectAll" onclick="toggleSelectAll(this)"></th>
                        <th>البيانات المستخرجة (الرقم / التفاصيل)</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="2" style="text-align: center; color: #64748b;">قم برفع شيت الأكسيل لعرض الأرقام هنا</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let excelData = [];
        let selectedQueue = [];
        let currentIndex = 0;

        function handleExcel(event) {
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById('fileInfo').innerText = `تم اختيار الملف: ${file.name}`;
            const reader = new FileReader();

            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                
                excelData = XLSX.utils.sheet_to_json(worksheet, {header: 1});
                displayTable(excelData);
            };
            reader.readAsArrayBuffer(file);
        }

        function displayTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            data.forEach((row) => {
                if(row && row.length > 0 && row.some(cell => cell !== undefined && cell !== '')) {
                    const rowText = row.join(' - ');
                    const phoneCandidate = row.find(cell => cell && cell.toString().replace(/\D/g, '').length >= 7) || row[0];
                    
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><input type="checkbox" class="row-checkbox" value="${phoneCandidate}"></td>
                        <td>${rowText}</td>
                    `;
                    tbody.appendChild(tr);
                }
            });
        }

        function toggleSelectAll(source) {
            const checkboxes = document.querySelectorAll('.row-checkbox');
            checkboxes.forEach(cb => cb.checked = source.checked);
        }

        function startSequentialSending() {
            const message = document.getElementById('wamessage').value;
            const checkboxes = document.querySelectorAll('.row-checkbox:checked');

            if(checkboxes.length === 0) {
                alert('من فضلك اختر رقم واحد على الأقل من الجدول!');
                return;
            }

            if(!message.trim()) {
                alert('من فضلك اكتب الرسالة أولاً!');
                return;
            }

            // تجهيز قائمة الأرقام المحددة
            selectedQueue = Array.from(checkboxes).map(cb => cb.value);
            currentIndex = 0;

            sendNextNumber(message);
        }

        function sendNextNumber(message) {
            if (currentIndex >= selectedQueue.length) {
                document.getElementById('statusBadge').innerText = "✅ تم الانتهاء من إرسال جميع الأرقام المحددة بنجاح!";
                alert("تم الانتهاء من جميع الأرقام المحددة!");
                return;
            }

            let phone = selectedQueue[currentIndex].toString().replace(/\D/g, '');
            if (phone.startsWith('0')) {
                phone = '20' + phone.substring(1);
            }

            const encodedMessage = encodeURIComponent(message);
            const whatsappUrl = `https://web.whatsapp.com/send?phone=${phone}&text=${encodedMessage}`;

            // فتح التاب للرقم الحالي فقط
            window.open(whatsappUrl, '_blank');

            document.getElementById('statusBadge').innerText = `📤 جاري معالجة الرقم (${currentIndex + 1} من ${selectedQueue.length}) - اضغط الزر للرقم التالى بعد الإرسال`;
            
            // تغيير نص الزر ليكون واضحاً للخطوة القادمة
            const btn = document.querySelector('.btn');
            btn.innerText = `➡️ افتح الرقم التالي (${currentIndex + 2}/${selectedQueue.length})`;

            currentIndex++;
        }

        function resetQueue() {
            selectedQueue = [];
            currentIndex = 0;
            document.getElementById('statusBadge').innerText = "تم إعادة الضبط. اختر الأرقام وابدأ من جديد.";
            document.querySelector('.btn').innerText = "🚀 إرسال متسلسل (فتح الرقم التالي)";
        }
    </script>
</body>
</html>
